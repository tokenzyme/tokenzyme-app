version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router'
          - '@types/react*'
      apollo:
        patterns:
          - '@apollo/*'
          - 'graphql*'
          - '@graphql-codegen/*'
      web3:
        patterns:
          - 'ethers'
          - '@reown/*'
          - '@typechain/*'
      linting:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
